name: Tests

on:
  push:
  pull_request:

jobs:
  integration-tests:
    name: Test on ${{ matrix.runs-on }}, py${{ matrix.python-version }}, ${{ matrix.env-type }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
        env-type: ["cpu", "base-cpu"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Pixi
        uses: prefix-dev/setup-pixi@v0.11.3
        with:
          manifest-path: pyproject.toml
          cache: true
          locked: true

      - name: Check Contorsion installation
        run: pixi run contorsion --help

      - name: Install dependencies
        run: |
          pixi add
          

      - name: Run integration tests
        run: |
          pytest tests/integration/ -v
